<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流光石 · 月亮归巢</title><link rel="stylesheet" href="style.css?v=55"></head><body><a href="../../#work" style="position:fixed;left:16px;top:14px;z-index:99999;color:#f3e2b4;background:#111b;border:1px solid #f3e2b455;padding:8px 12px;text-decoration:none;font:12px sans-serif">返回作品集</a><canvas id="scene" tabindex="0" aria-label="俯视的暗石平台。按住石球拿起，拖动后松手放下，也可用方向键推动。"></canvas><p id="loading" role="status">正在点亮石头…</p>
<div id="htmlSource" aria-hidden="true"><div id="engraving"><header><nav class="modeTabs" aria-hidden="true"><button class="modeButton" data-view-mode="stone" aria-pressed="true">流光石<span>Lumen stone</span></button><button class="modeButton" data-view-mode="bulb" aria-pressed="false">电灯泡<span>Electric bulb</span></button></nav><div class="topNote">光经过，字才醒来。</div></header><section><h1>借一轮月，<br>放在手心。</h1><p>石中藏星，微光有声。<br>拾起月亮，它总会慢慢归巢。</p></section><div class="fieldNote">按住拿起 · 松手归巢 · 聆听滚动<span>首次操作启用声音 · 方向键轻推</span></div><div class="wellMark" aria-hidden="true"></div><footer><div class="palette"><span class="dot amber">●</span><span class="dot jade">●</span><span class="dot moon">●</span><span class="dot filament">●</span><span id="colorName">暖月</span></div><div class="strength">微光 ─────── 明亮</div><div class="rightControls"><span id="soundText">声音 开</span><span class="resetText">重新放好 ↺</span></div></footer></div></div>
<nav id="modeControls" aria-label="光源模式"><button class="modeButton" data-mode="stone" aria-pressed="true">流光石<span>Lumen stone</span></button><button class="modeButton" data-mode="bulb" aria-pressed="false">电灯泡<span>Electric bulb</span></button></nav><div id="controls"><button class="color a" data-color="#ffe2b3" aria-label="暖月" aria-pressed="true"></button><button class="color b" data-color="#83e5d5" aria-label="青玉" aria-pressed="false"></button><button class="color c" data-color="#a5b4ff" aria-label="月光" aria-pressed="false"></button><button class="color d" data-color="#ffae63" aria-label="灯丝橙金" aria-pressed="false"></button><input id="power" aria-label="发光强度" type="range" min="0.15" max="2" step=".01" value="1"><button id="sound" aria-label="声音开关" aria-pressed="true"></button><button id="reset" aria-label="重新放好"></button></div><aside id="physicsPanel" aria-label="石球物理参数"><button id="panelToggle" aria-expanded="false" aria-controls="physicsBody"><span>滚动手感</span><span id="motionStatus">静止</span><span class="fold">+</span></button><div id="physicsBody" hidden><p class="panelHint">调整运动手感。</p><fieldset class="settingGroup" data-setting-mode="stone"><legend>石球归巢</legend><label>回滚加速度 <output data-output="returnAcceleration"></output><input data-setting="returnAcceleration" type="range" min="0.1" max="1.2" step="0.02" aria-label="回滚加速度"></label><label>凹槽作用范围 <output data-output="wellRadius"></output><input data-setting="wellRadius" type="range" min="0.5" max="1.8" step="0.05" aria-label="凹槽作用范围"></label><label>凹槽回弹强度 <output data-output="stiffness"></output><input data-setting="stiffness" type="range" min="1.5" max="12" step="0.1" aria-label="凹槽回弹强度"></label><label>回摆阻尼 <output data-output="dampingRatio"></output><input data-setting="dampingRatio" type="range" min="0.06" max="0.85" step="0.01" aria-label="回摆阻尼"></label></fieldset><fieldset class="settingGroup" data-setting-mode="bulb"><legend>拖动跟手</legend><label>灯尾立起时间 <output data-output="pickupTransition"></output><input data-setting="pickupTransition" type="range" min="0.15" max="0.8" step="0.05" aria-label="灯尾立起时间"></label><label>柄跟手速度 <output data-output="gripFollow"></output><input data-setting="gripFollow" type="range" min="15" max="100" step="1" aria-label="柄跟手速度"></label><label>提起速度 <output data-output="liftSpeed"></output><input data-setting="liftSpeed" type="range" min="3" max="16" step="0.5" aria-label="提起速度"></label><label>拖动惯性 <output data-output="dragInertia"></output><input data-setting="dragInertia" type="range" min="0" max="1" step="0.05" aria-label="拖动惯性"></label></fieldset><fieldset class="settingGroup" data-setting-mode="bulb"><legend>悬挂摆动</legend><label>悬挂摆动上限 <output data-output="maxSwingAngle"></output><input data-setting="maxSwingAngle" type="range" min="10" max="80" step="1" aria-label="悬挂摆动上限"></label><label>悬挂摆动阻尼 <output data-output="swingDamping"></output><input data-setting="swingDamping" type="range" min="0.5" max="10" step="0.1" aria-label="悬挂摆动阻尼"></label><label>下垂力度 <output data-output="swingGravity"></output><input data-setting="swingGravity" type="range" min="6" max="30" step="1" aria-label="下垂力度"></label></fieldset><fieldset class="settingGroup" data-setting-mode="bulb"><legend>释放与抛掷</legend><label>甩出力度 <output data-output="throwStrength"></output><input data-setting="throwStrength" type="range" min="0" max="1.2" step="0.05" aria-label="甩出力度"></label><label>最高甩出速度 <output data-output="maxThrowSpeed"></output><input data-setting="maxThrowSpeed" type="range" min="1" max="8" step="0.25" aria-label="最高甩出速度"></label></fieldset><fieldset class="settingGroup" data-setting-mode="bulb"><legend>落地绕轴</legend><label>朝原点加速度 <output data-output="orbitAcceleration"></output><input data-setting="orbitAcceleration" type="range" min="0.1" max="4" step="0.05" aria-label="朝原点加速度"></label><label>绕轴回摆阻尼 <output data-output="orbitDamping"></output><input data-setting="orbitDamping" type="range" min="0.05" max="2" step="0.05" aria-label="绕轴回摆阻尼"></label><label>绕轴半径倍数 <output data-output="orbitRadiusScale"></output><input data-setting="orbitRadiusScale" type="range" min="1" max="2.5" step="0.05" aria-label="绕轴半径倍数"></label></fieldset><fieldset class="settingGroup" data-setting-mode="both"><legend>碰撞与速度</legend><label>最高线速度 <output data-output="maxSpeed"></output><input data-setting="maxSpeed" type="range" min="0.25" max="2" step="0.01" aria-label="最高线速度"></label><label>落地回弹 <output data-output="restitution"></output><input data-setting="restitution" type="range" min="0" max="0.5" step="0.01" aria-label="落地回弹"></label></fieldset><div class="panelActions"><button id="tryRoll">试滚一次</button><button id="resetSettings">恢复默认</button></div><p class="panelFoot">向下滚动，查看更多参数。</p></div></aside><script type="module" src="app.js?v=60"></script></body></html>
